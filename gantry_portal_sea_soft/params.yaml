model:
  name: gantry_portal_sea_soft

option:
  gravity: "0 0 -9.81"
  timestep: 0.0002

geom:
  friction_default: "0.8 0.1 0.1"
  rgba_default: "0.7 0.7 0.7 1"

# World->chassis fixed offset (kept for compatibility with your previous setup)
chassis:
  z0: 0.1

# Portal appearance + geometry (MJCF uses HALF-SIZES for boxes)
portal:
  rgba: "0.2 0.2 0.2 1"
  leg:
    size: "0.05 0.05 1.0"   # 0.10 x 0.10 x 2.00 m
    rgba: "0.2 0.2 0.2 1"
  beam_x:
    size: "1.0 0.05 0.05"   # 2.00 x 0.10 x 0.10 m
    rgba: "0.2 0.2 0.2 1"

# Moving carriages (HALF-SIZES)
cursor:
  size: "0.06 0.06 0.05"
  rgba: "0.2 0.5 0.9 1"

carriage:
  size: "0.05 0.05 0.05"
  rgba: "0.3 0.3 0.3 1"

# beam3: 2m long along +y (HALF-SIZES); geom centered at y=+1 in its local frame
beam3:
  size: "0.05 1.0 0.05"
  pos: "0 1 0"
  rgba: "0.8 0.8 0.8 1"

# beam4: 2m vertical (HALF-SIZES); link frame at lower end; geom centered at z=+1
beam4:
  size: "0.05 0.05 1.0"
  pos: "0 0 1"
  rgba: "0.8 0.8 0.8 1"

# End-effector box (HALF-SIZES); placed slightly below beam4 lower end
ee:
  size: "0.05 0.05 0.10"
  pos: "0 0 -0.05"
  rgba: "0.9 0.3 0.3 1"
  site_pos: "0 0 0"
  site_size: "0.10"

joints:
  armature: 0.01
  frictionloss: 0.0

  # Coordinate conventions (recommended for this portal):
  # - joint_1: x from leg1 top (x=-1) to leg2 top (x=+1) => [0, 2]
  # - joint_2: y along beam3 from y=-1 to y=+1 (in world) => [0, 2]
  # - joint_3: z, rest at z=2 (beam3 plane), extend DOWN to z=0 => [-2, 0]
  motor_range_x: "-0.53 1.2"
  motor_range_y: "-0.85 0.85"
  motor_range_z: "-0.05 2.0"

sea:
  use_spring: true
  spring_range: "-0.18 0.18"
  springref: 0
  stiffness: [122192.8176, 153668.0008, 127668.2643] # N/m
  damping: [28.9931, 21.6802, 33.584] # N*s/m

actuators:
  ctrlrange: "-300 300"
  gear: [1, 1, 1]
  forcerange: ["-300 300", "-300 300", "-300 300"]  # N

vase:
  dist_x: 0.850
  dist_y: 0.17
  min_x: -0.425
  max_x: 0.425
  min_y: -0.425
  max_y: 0.425
  z: 0.751
  spawn: false

# URDF defaults (optional)
urdf_settings:
  velocity: 1.0
  damping: 0.0
  friction: 0.0

# Inertial properties (kg, kg*m^2) about COM in each link frame.
# Note: portal links are fixed; inertias matter mainly for simulators that require them.
inertial:
  chassis:
    com: "0 0 0"
    mass: 0.3944
    I: "0.1 0.1 0.1"

  leg:
    com: "0 0 1"
    mass: 0.3413
    I: "0.334167 0.334167 0.1667"

  beam_x:
    com: "1 0 0"
    mass: 0.4584
    I: "0.001667 0.334167 0.334167"

  cursor_1:
    com: "0 0 0"
    mass: 0.362
    I: "0.000866667 0.000866667 0.0012"

  beam3:
    com: "0 1 0"
    mass: 0.3266
    I: "0.334167 0.001667 0.334167"

  cursor_2:
    com: "0 0 0"
    mass: 0.4606
    I: "0.000866667 0.000866667 0.0012"

  beam4_carriage:
    com: "0 0 0"
    mass: 0.6672
    I: "0.0002 0.0002 0.0002"

  beam4:
    com: "0 0 1"
    mass: 0.6202
    I: "0.334167 0.334167 0.001667"

  ee:
    com: "0 0 -0.05"
    mass: 0.6061
    I: "0.000333333 0.000333333 0.000333333"
